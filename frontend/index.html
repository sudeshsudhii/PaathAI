        fetch(`${API_URL}/courses`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(form)
        }).then(r => r.json()).then(c => {
            setCourses(prev => [c, ...prev]);
            setShowCreate(false);
            setForm({ name: '', code: '', semester: '', description: '' });
            showToast('Course created!', 'success');
        }).catch(() => showToast('Failed to create course', 'error'));
    };

    const archiveCourse = (id, e) => {
        e.stopPropagation();
        fetch(`${API_URL}/courses/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(() => {
            setCourses(prev => prev.filter(c => c.id !== id));
            showToast('Course archived', 'success');
        });
    };

    if (selectedCourse) {
        return <CourseDetailPage token={token} courseId={selectedCourse} showToast={showToast}
                                 onBack={() => setSelectedCourse(null)} />;
    }

    return (
        <div>
            <div className="page-title-row">
                <h1>📚 My Courses</h1>
            </div>
            <div className="course-grid">
                <button className="create-course-btn" onClick={() => setShowCreate(true)}>
                    <span>+</span>
                    <span>Create Course</span>
                </button>
                {courses.map(c => (
                    <div key={c.id} className="course-card" onClick={() => setSelectedCourse(c.id)}>
                        <div className="course-card-header">
                            <div>
                                <h3>{c.name}</h3>
                                {c.semester && <div className="course-semester">{c.semester}</div>}
                            </div>
                            {c.code && <span className="course-code">{c.code}</span>}
                        </div>
                        {c.description && <p style={{fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px'}}>{c.description}</p>}
                        <div className="course-card-footer">
                            <span className="course-stat">📖 {c.lectureCount} lectures</span>
                            <span className="course-stat">{c.syllabusAttached ? '✅ Syllabus' : '➕ No Syllabus'}</span>
                            <button className="tree-action-btn" onClick={(e) => archiveCourse(c.id, e)} title="Archive">🗑️</button>
                        </div>
                    </div>
                ))}
            </div>

            {showCreate && (
                <div className="modal-overlay" onClick={() => setShowCreate(false)}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <h2>Create New Course</h2>
                        <input className="input" placeholder="Course Name *" value={form.name}
                               onChange={e => setForm({...form, name: e.target.value})} />
                        <input className="input" placeholder="Course Code (e.g. CS301)" value={form.code}
                               onChange={e => setForm({...form, code: e.target.value})} style={{marginTop: '12px'}} />
                        <input className="input" placeholder="Semester (e.g. Fall 2026)" value={form.semester}
                               onChange={e => setForm({...form, semester: e.target.value})} style={{marginTop: '12px'}} />
                        <textarea className="input" placeholder="Description" value={form.description}
                                  onChange={e => setForm({...form, description: e.target.value})}
                                  style={{marginTop: '12px', minHeight: '80px', resize: 'vertical'}} />
                        <div className="modal-actions">
                            <button className="btn-secondary" onClick={() => setShowCreate(false)}>Cancel</button>
                            <button className="btn-primary" onClick={createCourse} disabled={!form.name}>Create</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ==================== COURSE DETAIL PAGE ====================
function CourseDetailPage({ token, courseId, showToast, onBack }) {
    const [course, setCourse] = React.useState(null);
    const [tab, setTab] = React.useState('syllabus');
    const [syllabusTree, setSyllabusTree] = React.useState(null);
    const [coverage, setCoverage] = React.useState(null);
    const [lectures, setLectures] = React.useState([]);

    React.useEffect(() => {
        fetch(`${API_URL}/courses/${courseId}`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(r => r.json()).then(setCourse);
        fetch(`${API_URL}/courses/${courseId}/lectures`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(r => r.json()).then(setLectures).catch(() => {});
        fetch(`${API_URL}/courses/${courseId}/syllabus`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(r => r.ok ? r.json() : null).then(setSyllabusTree).catch(() => {});
        fetch(`${API_URL}/courses/${courseId}/coverage`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(r => r.ok ? r.json() : null).then(setCoverage).catch(() => {});
    }, [courseId, token]);

    const createManualSyllabus = () => {
        fetch(`${API_URL}/courses/${courseId}/syllabus/manual`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: course?.name + ' Syllabus' })
        }).then(r => r.json()).then(() => {
            showToast('Syllabus created!', 'success');
            fetch(`${API_URL}/courses/${courseId}/syllabus`, { headers: { 'Authorization': `Bearer ${token}` } })
                .then(r => r.ok ? r.json() : null).then(setSyllabusTree);
        });
    };

    if (!course) return <div style={{padding: '48px', textAlign: 'center', color: 'var(--text-muted)'}}>Loading...</div>;

    return (
        <div>
            <div className="course-detail-header">
                <div>
                    <button className="tree-action-btn" onClick={onBack} style={{marginBottom: '8px', fontSize: '16px'}}>← Back</button>
                    <h1>{course.name}</h1>
                    <div style={{display: 'flex', gap: '12px', marginTop: '4px'}}>
                        {course.code && <span className="course-code">{course.code}</span>}
                        {course.semester && <span className="course-semester">{course.semester}</span>}
                    </div>
                </div>
            </div>

            <div className="course-detail-tabs">
                {['syllabus', 'coverage', 'lectures'].map(t => (
                    <button key={t} className={`course-detail-tab ${tab === t ? 'active' : ''}`}
                            onClick={() => setTab(t)}>
                        {t === 'syllabus' ? '📋 Syllabus' : t === 'coverage' ? '📊 Coverage' : '📖 Lectures'}
                    </button>
                ))}
            </div>

            {tab === 'syllabus' && (
                syllabusTree ? (
                    <SyllabusTreeEditor tree={syllabusTree} token={token} showToast={showToast}
                                         onRefresh={() => {
                                             fetch(`${API_URL}/courses/${courseId}/syllabus`, { headers: { 'Authorization': `Bearer ${token}` } })
                                                 .then(r => r.ok ? r.json() : null).then(setSyllabusTree);
                                         }} />
                ) : (
                    <div style={{textAlign: 'center', padding: '48px'}}>
                        <p style={{color: 'var(--text-muted)', marginBottom: '16px'}}>No syllabus attached yet</p>
                        <button className="btn-primary" onClick={createManualSyllabus}>📋 Create Syllabus</button>
                    </div>
                )
            )}

            {tab === 'coverage' && (
                coverage ? <CoverageDashboard coverage={coverage} /> : (
                    <div style={{textAlign: 'center', padding: '48px', color: 'var(--text-muted)'}}>
                        No coverage data yet. Add a syllabus and record lectures to track coverage.
                    </div>
                )
            )}

            {tab === 'lectures' && (
                <div>
                    {lectures.length === 0 ? (
                        <div style={{textAlign: 'center', padding: '48px', color: 'var(--text-muted)'}}>
                            No lectures yet. Upload or record a lecture from the Dashboard or Live page.
                        </div>
                    ) : lectures.map(l => (
                        <div key={l.id} className="coverage-row" style={{cursor: 'default'}}>
                            <span className="coverage-row-name">📖 {l.title}</span>
                            <span className={`topic-status-badge ${l.status === 'COMPLETED' ? 'completed' : 'in-progress'}`}>
                                {l.status}
                            </span>
                            <span style={{fontSize: '12px', color: 'var(--text-muted)'}}>{l.createdAt}</span>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

// ==================== SYLLABUS TREE EDITOR ====================
function SyllabusTreeEditor({ tree, token, showToast, onRefresh }) {
    const [expanded, setExpanded] = React.useState({});
    const [addingTo, setAddingTo] = React.useState(null);
    const [newName, setNewName] = React.useState('');

    const toggle = (key) => setExpanded(prev => ({ ...prev, [key]: !prev[key] }));

    const addSubject = () => {
        if (!newName.trim()) return;
        fetch(`${API_URL}/syllabus/${tree.syllabusId}/subjects`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName })
        }).then(() => { setNewName(''); setAddingTo(null); showToast('Subject added', 'success'); onRefresh(); });
    };

    const addUnit = (subjectId) => {
        if (!newName.trim()) return;
        fetch(`${API_URL}/syllabus/subjects/${subjectId}/units`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName })
        }).then(() => { setNewName(''); setAddingTo(null); showToast('Unit added', 'success'); onRefresh(); });
    };

    const addTopic = (unitId) => {
        if (!newName.trim()) return;
        fetch(`${API_URL}/syllabus/units/${unitId}/topics`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName })
        }).then(() => { setNewName(''); setAddingTo(null); showToast('Topic added', 'success'); onRefresh(); });
    };

    const deleteTopic = (topicId) => {
        fetch(`${API_URL}/syllabus/topics/${topicId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(() => { showToast('Topic deleted', 'success'); onRefresh(); });
    };

    return (
        <div className="syllabus-tree">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px'}}>
                <h3 style={{fontSize: '16px', fontWeight: 600}}>{tree.title || 'Syllabus'}</h3>
                <span className="course-code">{tree.sourceType}</span>
            </div>

            {(tree.subjects || []).map(subject => (
                <div key={subject.id} className="tree-subject">
                    <div className="tree-subject-header" onClick={() => toggle(`s${subject.id}`)}>
                        <span className={`tree-toggle ${expanded[`s${subject.id}`] ? 'open' : ''}`}>▶</span>
                        <span>📘 {subject.name}</span>
                        <div className="tree-actions">
                            <button className="tree-action-btn" onClick={e => { e.stopPropagation(); setAddingTo(`u-${subject.id}`); setNewName(''); }}>+ Unit</button>
                        </div>
                    </div>
                    {expanded[`s${subject.id}`] && (subject.units || []).map(unit => (
                        <div key={unit.id}>
                            <div className="tree-unit-header" onClick={() => toggle(`u${unit.id}`)}>
                                <span className={`tree-toggle ${expanded[`u${unit.id}`] ? 'open' : ''}`}>▶</span>
                                <span>📂 {unit.name}</span>
                                <div className="tree-actions">
                                    <button className="tree-action-btn" onClick={e => { e.stopPropagation(); setAddingTo(`t-${unit.id}`); setNewName(''); }}>+ Topic</button>
                                </div>
                            </div>
                            {expanded[`u${unit.id}`] && (
                                <div className="tree-topics">
                                    {(unit.topics || []).map(topic => (
                                        <div key={topic.id} className="tree-topic">
                                            <span className={`topic-status-badge ${(topic.coverageStatus || 'NOT_STARTED').toLowerCase().replace('_', '-')}`}>
                                                {(topic.coverageStatus || 'NOT_STARTED').replace('_', ' ')}
                                            </span>
                                            <span>{topic.name}</span>
                                            <div className="tree-actions">
                                                <button className="tree-action-btn" onClick={() => deleteTopic(topic.id)}>🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                    {addingTo === `t-${unit.id}` && (
                                        <div className="tree-topic" style={{gap: '8px'}}>
                                            <input className="input" style={{flex: 1, padding: '6px 10px', fontSize: '13px'}}
                                                   placeholder="Topic name" value={newName} autoFocus
                                                   onChange={e => setNewName(e.target.value)}
                                                   onKeyDown={e => e.key === 'Enter' && addTopic(unit.id)} />
                                            <button className="tree-action-btn" onClick={() => addTopic(unit.id)}>✓</button>
                                            <button className="tree-action-btn" onClick={() => setAddingTo(null)}>✕</button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    ))}
                    {expanded[`s${subject.id}`] && addingTo === `u-${subject.id}` && (
                        <div className="tree-unit-header" style={{gap: '8px'}}>
                            <input className="input" style={{flex: 1, padding: '6px 10px', fontSize: '13px'}}
                                   placeholder="Unit name" value={newName} autoFocus
                                   onChange={e => setNewName(e.target.value)}
                                   onKeyDown={e => e.key === 'Enter' && addUnit(subject.id)} />
                            <button className="tree-action-btn" onClick={() => addUnit(subject.id)}>✓</button>
                            <button className="tree-action-btn" onClick={() => setAddingTo(null)}>✕</button>
                        </div>
                    )}
                </div>
            ))}

            <button className="tree-add-btn" onClick={() => { setAddingTo('subject'); setNewName(''); }}>
                + Add Subject
            </button>
            {addingTo === 'subject' && (
                <div style={{display: 'flex', gap: '8px', marginTop: '8px', marginLeft: '40px'}}>
                    <input className="input" style={{flex: 1, padding: '6px 10px', fontSize: '13px'}}
                           placeholder="Subject name" value={newName} autoFocus
                           onChange={e => setNewName(e.target.value)}
                           onKeyDown={e => e.key === 'Enter' && addSubject()} />
                    <button className="tree-action-btn" onClick={addSubject}>✓</button>
                    <button className="tree-action-btn" onClick={() => setAddingTo(null)}>✕</button>
                </div>
            )}
        </div>
    );
}

// ==================== COVERAGE DASHBOARD ====================
function CoverageDashboard({ coverage }) {
    const radius = 60;
    const circumference = 2 * Math.PI * radius;
    const progress = (coverage.overallPercent / 100) * circumference;

    return (
        <div>
            <div className="coverage-overview">
                <div className="coverage-ring">
                    <svg viewBox="0 0 160 160">
                        <circle cx="80" cy="80" r={radius} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="10" />
                        <circle cx="80" cy="80" r={radius} fill="none" stroke="url(#coverageGrad)" strokeWidth="10"
                                strokeDasharray={circumference} strokeDashoffset={circumference - progress}
                                strokeLinecap="round" transform="rotate(-90 80 80)"
                                style={{transition: 'stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1)'}} />
                        <defs>
                            <linearGradient id="coverageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stopColor="#7c3aed" />
                                <stop offset="50%" stopColor="#2563eb" />
                                <stop offset="100%" stopColor="#06b6d4" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div className="coverage-ring-text">
                        <div className="percent">{Math.round(coverage.overallPercent)}%</div>
                        <div className="label">Coverage</div>
                    </div>
                </div>
                <div className="coverage-stats">
                    <div className="coverage-stat-card">
                        <div className="value">{coverage.totalTopics}</div>
                        <div className="stat-label">Total Topics</div>
                    </div>
                    <div className="coverage-stat-card">
                        <div className="value">{coverage.coveredTopics}</div>
                        <div className="stat-label">Covered</div>
                    </div>
                    <div className="coverage-stat-card">
                        <div className="value">{coverage.totalTopics - coverage.coveredTopics}</div>
                        <div className="stat-label">Remaining</div>
                    </div>
                </div>
            </div>

            {(coverage.subjects || []).map(subject => (
                <div key={subject.id} style={{marginBottom: '20px'}}>
                    <div className="coverage-row" style={{fontWeight: 600}}>
                        <span className="coverage-row-name">📘 {subject.name}</span>
                        <div className="coverage-bar-container">
                            <div className={`coverage-bar-fill ${subject.status.toLowerCase().replace('_', '-')}`}
                                 style={{width: `${subject.percent}%`}} />
                        </div>
                        <span className="coverage-row-percent">{Math.round(subject.percent)}%</span>
                    </div>
                    {(subject.units || []).map(unit => (
                        <div key={unit.id} style={{marginLeft: '24px'}}>
                            <div className="coverage-row">
                                <span className="coverage-row-name" style={{fontWeight: 400}}>📂 {unit.name}</span>
                                <div className="coverage-bar-container">
                                    <div className={`coverage-bar-fill ${unit.status.toLowerCase().replace('_', '-')}`}
                                         style={{width: `${unit.percent}%`}} />
                                </div>
                                <span className="coverage-row-percent">{Math.round(unit.percent)}%</span>
                            </div>
                        </div>
                    ))}
                </div>
            ))}
        </div>
    );
}

// ==================== APP ====================
function App() {
    const auth = useAuth();
    const { toast, show: showToast } = useToast();
    const [page, setPage] = React.useState("courses");

    if (!auth.isAuthenticated) {
        return (
            <>
                <AuthPage onLogin={auth.login} />
                <Toast toast={toast} />
            </>
        );
    }

    return (
        <>
            <nav className="nav">
                <div className="nav-inner">
                    <span className="nav-brand">PaathAI</span>
                    <div className="nav-links">
                        <button
                            className={`nav-link ${page === "courses" ? "active" : ""}`}
                            onClick={() => setPage("courses")}>
                            📚 Courses
                        </button>
                        <button 
                            className={`nav-link ${page === "live" ? "active" : ""}`}
                            onClick={() => setPage("live")}>
                            🎙️ Live
                        </button>
                        <button 
                            className={`nav-link ${page === "dashboard" ? "active" : ""}`}
                            onClick={() => setPage("dashboard")}>
                            📖 Upload
                        </button>
                        <button 
                            className={`nav-link ${page === "search" ? "active" : ""}`}
                            onClick={() => setPage("search")}>
                            🔍 Search
                        </button>
                        <button 
                            className="nav-link logout"
                            onClick={auth.logout}>
                            Logout
                        </button>
                    </div>
                </div>
            </nav>

            <main className="main">
                {page === "courses" && (
                    <CoursesPage token={auth.token} showToast={showToast} />
                )}
                {page === "live" && (
                    <LiveRecordingPage token={auth.token} showToast={showToast} />
                )}
                {page === "dashboard" && (
                    <Dashboard token={auth.token} showToast={showToast} />
                )}
                {page === "search" && (
                    <SearchPage token={auth.token} showToast={showToast} />
                )}
            </main>

            <Toast toast={toast} />
        </>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
