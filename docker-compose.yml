version: '3.9'

services:
  # --- Spring Boot Backend ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paathai
      SPRING_DATASOURCE_USERNAME: paathai
      SPRING_DATASOURCE_PASSWORD: paathai_dev
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PAATHAI_WHISPER_URL: http://whisper:9000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - lecture-audio:/app/audio

  # --- PostgreSQL + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: paathai
      POSTGRES_USER: paathai
      POSTGRES_PASSWORD: paathai_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paathai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Whisper ASR ---
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: openai_whisper
    deploy:
      resources:
        limits:
          memory: 4G

  # --- Ollama (optional — only with `--profile with-ollama`) ---
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    profiles:
      - with-ollama

volumes:
  pgdata:
  lecture-audio:
  ollama-models:
