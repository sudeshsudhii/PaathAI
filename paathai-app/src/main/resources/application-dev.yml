      api-key: ${GEMINI_API_KEY:}
      model-flash: gemini-2.0-flash
      model-pro: gemini-2.0-pro

# Dev logging
logging:
  level:
    com.paathai: DEBUG
    org.hibernate.SQL: DEBUG
