spring:
  datasource:
    url: jdbc:h2:file:${java.io.tmpdir}/paathai-dev;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

# Whisper ASR service
paathai:
  whisper:
    url: http://localhost:9000
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model-flash: gemini-2.0-flash
      model-pro: gemini-2.0-pro
  audio:
    storage-path: ${java.io.tmpdir}/paathai-uploads

# Dev logging
logging:
  level:
    com.paathai: DEBUG
    org.hibernate.SQL: DEBUG
