spring:
  application:
    name: paathai

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # File upload limits
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# JWT Configuration
jwt:
  secret: "PaathAI-Super-Secret-Key-Min-32-Chars-Long-For-HS256-Encryption-MVP"
  expiration: 86400000  # 24 hours

# PaathAI custom properties
paathai:
  prompts:
    base-path: prompts
  ai:
    daily-student-token-limit: 50000
  audio:
    storage-path: /app/audio

# Logging
logging:
  level:
    com.paathai: INFO
    org.springframework.security: WARN
